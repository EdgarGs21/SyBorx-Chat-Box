<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyBorx Chat — El futuro del desarrollo con IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Pantalla de Login / Registro ===== -->
  <div id="login-screen" class="screen hidden">
    <div class="auth-card glass">
      <div class="auth-logo">
        <span class="brand-ico large">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </span>
        <h1>SYBORX CHAT</h1>
      </div>
      <p class="auth-sub">El futuro del desarrollo impulsado por IA</p>

      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" type="button">Iniciar sesión</button>
        <button id="tab-register" class="auth-tab" type="button">Registrarse</button>
      </div>

      <form id="auth-form" autocomplete="off">
        <div class="field">
          <label for="auth-username">Usuario</label>
          <input id="auth-username" type="text" placeholder="ej. DevArchitect" required>
        </div>
        <div class="field">
          <label for="auth-password">Contraseña</label>
          <input id="auth-password" type="password" placeholder="••••••••" required>
        </div>
        <div id="auth-error" class="auth-error"></div>
        <button id="auth-submit" type="submit" class="btn-primary">Iniciar sesión</button>
      </form>
    </div>
  </div>

  <!-- ===== Aplicación Principal ===== -->
  <div id="app" class="app hidden">

    <!-- Sidebar Izquierdo -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-header">
          <div class="brand">
            <span class="brand-ico">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="3"/>
                <path d="m9 10-2 2 2 2m6-4 2 2-2 2"/>
              </svg>
            </span>
            <span class="brand-title">SYBORX</span>
          </div>
          <button id="sidebar-toggle" class="icon-btn mobile-only" title="Ocultar menú">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </button>
        </div>

        <button id="new-chat" class="new-chat-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          NUEVO CHAT
        </button>

        <div class="sidebar-section-title">RECENT SESSIONS</div>

        <div id="chat-list" class="chat-list"></div>

        <div class="sidebar-footer">
          <button id="profile-btn" class="profile-card-btn">
            <span id="avatar" class="avatar">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <div class="profile-text">
              <span id="profile-name" class="profile-name">DevArchitect</span>
              <span id="profile-tier" class="profile-tier">PRO MEMBER</span>
            </div>
          </button>
          
          <div id="profile-menu" class="dropdown glass hidden">
            <button id="switch-account-btn" type="button">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Cambiar cuenta
            </button>
            <button id="logout-btn" class="danger" type="button">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Cerrar sesión
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Área Principal de Chat -->
    <main class="main">
      <!-- Barra Superior de Estado y Controles -->
      <header class="top-nav">
        <button id="sidebar-reopen" class="sidebar-reopen icon-btn" title="Abrir menú">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>

        <div class="system-status">
          <span class="status-dot"></span>
          <span class="status-text">SYSTEM READY</span>
        </div>

        <div class="top-actions">
          <button id="theme-toggle" class="icon-btn" title="Cambiar tema claro / oscuro"></button>
          <button id="settings-btn" class="icon-btn" title="Configuración de modelo">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>

          <div id="settings-menu" class="dropdown glass hidden">
            <div class="drop-title">Modelo de Gemini</div>
            <select id="model-select" class="model-select">
              <option value="gemini-3.6-flash">Gemini 3.6 Flash (Recomendado)</option>
              <option value="gemini-3.1-flash">Gemini 3.1 Flash</option>
              <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
              <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
              <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
            </select>
            <div class="drop-note">Se sincroniza automáticamente con el backend.</div>
          </div>
        </div>
      </header>

      <!-- Mensajes o Pantalla de Bienvenida -->
      <div id="messages-area" class="messages-area">
        <!-- Hero Empty State -->
        <div id="empty-state" class="empty-state">
          <h1 class="hero-title">
            <span class="glow-cyan">SyBorx</span> <span class="glow-purple">Chat</span>
          </h1>
          <p class="hero-sub">El futuro del desarrollo impulsado por IA.</p>

          <!-- 2x2 Action Cards -->
          <div class="prompt-cards-grid">
            <button class="prompt-card" data-prompt="Realiza una inspección algorítmica y refactorización semántica de mi código para máxima eficiencia:">
              <div class="card-icon-wrap icon-cyan">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="4"/>
                  <path d="m10 9-3 3 3 3m4-6 3 3-3 3"/>
                </svg>
              </div>
              <div class="card-text-wrap">
                <h3>Code Analysis</h3>
                <p>Inspección algorítmica y refactorización semántica para máxima eficiencia.</p>
              </div>
            </button>

            <button class="prompt-card" data-prompt="Diseña una arquitectura de sistema escalable y topología cloud-native para:">
              <div class="card-icon-wrap icon-purple">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
              </div>
              <div class="card-text-wrap">
                <h3>Architecture Design</h3>
                <p>Modelado de sistemas escalables y topologías cloud-native.</p>
              </div>
            </button>

            <button class="prompt-card" data-prompt="Genera una síntesis técnica de API, diagramas y especificación para:">
              <div class="card-icon-wrap icon-teal">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="16" y1="13" x2="8" y2="13"/>
                  <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
              </div>
              <div class="card-text-wrap">
                <h3>Documentation</h3>
                <p>Síntesis automática de APIs, diagramas y especificaciones técnicas.</p>
              </div>
            </button>

            <button class="prompt-card" data-prompt="Ayúdame a identificar anomalías, stack traces y generar parches en tiempo real:">
              <div class="card-icon-wrap icon-coral">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="8" height="14" x="8" y="5" rx="4"/>
                  <path d="m19 7-3 2m-10-2 3 2m-3 8 3-2m10 2-3-2M9 19l-2 3m8-3 2 3M9 5 7 2m8 3 2-3"/>
                </svg>
              </div>
              <div class="card-text-wrap">
                <h3>Bug Fixing</h3>
                <p>Identificación de anomalías, stack traces y parches en tiempo real.</p>
              </div>
            </button>
          </div>
        </div>

        <!-- Lista de Mensajes Activa -->
        <div id="messages" class="messages hidden">
          <div id="messages-inner" class="messages-inner"></div>
        </div>
      </div>

      <!-- Preview de Adjuntos -->
      <div id="attachments-preview" class="attachments-preview"></div>

      <!-- Composer Bar -->
      <div class="composer-wrap">
        <div id="usage-hint" class="usage-hint"></div>
        
        <div class="composer-pill">
          <button id="attach-btn" class="icon-btn-attach" title="Adjuntar archivos">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          
          <textarea id="input" rows="1" placeholder="Escribe un mensaje o / para comandos..."></textarea>
          
          <button id="send-btn" class="send-circle" title="Enviar consulta">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>

        <div class="disclaimer-footer">
          SYBORX AI PUEDE COMETER ERRORES. VERIFICA LA INFORMACIÓN IMPORTANTE.
        </div>
      </div>

      <input type="file" id="file-input" multiple hidden accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.css,.py">
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
